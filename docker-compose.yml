# docker-compose.yml
services:
  mysql:
    image: mysql:8.4
    container_name: mysql84
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ruoyi123456
      MYSQL_DATABASE: mysql
      MYSQL_USER: ruoyi
      MYSQL_PASSWORD: ruoyi123456
      TZ: Asia/Shanghai
    volumes:
      - ~/mysql_data:/var/lib/mysql
      - ~/mysql_data/:/etc/mysql/conf.d
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_0900_ai_ci"
  redis:
    image: redis:latest
    container_name: redis-server
    restart: always
    ports:
      - "6379:6379"
    command: [ "redis-server", "--appendonly", "yes", "--requirepass", "ruoyi123456" ]